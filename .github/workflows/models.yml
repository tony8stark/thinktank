name: models
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: models
jobs:
  models:
    if: github.repository == 'tony8stark/thinktank'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/models-check.sh
        env:
          GH_TOKEN: ${{ github.token }}
